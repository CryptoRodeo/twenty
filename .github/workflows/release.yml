name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

      - name: Check tag and set versionCode
        id: version
        run: node scripts/release-version.js "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret ANDROID_$name is not set"; exit 1; fi
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android
          # arm64 only: every current phone; roughly halves the APK.
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm "$RUNNER_TEMP/release.jks"

      - name: Refuse debug-signed APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the debug key; release signing was not applied"; exit 1
          fi
          mv "$apk" "twenty-$GITHUB_REF_NAME.apk"

      - uses: softprops/action-gh-release@v3
        with:
          name: Twenty ${{ github.ref_name }}
          files: twenty-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
